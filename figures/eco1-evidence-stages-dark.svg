  <g id="text_26">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #afcbfa" transform="translate(194.67625 408.8635)">All 54 encounter states retained: 36 main + 18 held-out. Bars have one common denominator and no uncertainty intervals.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #afcbfa" transform="translate(232.34 417.82175)">Catalogue absence and frozen score advantage are different endpoints; none assigns genetic parentage.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #afcbfa" transform="translate(109.59125 426.78)">Known-identity structural proxy only. 36/40 clearings removed zero occupied cells; 0/40 immediately changed registered core counts. No disturbance-resilience claim.</text>
  </g>
